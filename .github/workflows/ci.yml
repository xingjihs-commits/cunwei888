name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 代码规范检查
        run: npm run lint

      - name: 单元测试
        run: npm test

      - name: 云函数语法检查
        run: |
          fail=0
          for f in cloudfunctions/*/index.js; do
            node --check "$f" || fail=1
          done
          exit $fail
